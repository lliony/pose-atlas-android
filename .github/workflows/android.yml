name: Android
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # 'tools' 已从 SDK 仓库移除，动作的默认包列表会以 "Failed to find package 'tools'" 失败
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the shared debug keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set; this APK uses the runner's own debug key and cannot update an existing install."
          fi
      - name: Test, lint, and assemble
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: pose-atlas-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pose-atlas-debug
          path: release
      - name: Name the attachment after the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv release/app-debug.apk "release/pose-atlas-${version}-debug.apk"
          cd release
          sha256sum pose-atlas-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate APK download QR code
        run: |
          python -m pip install 'qrcode[pil]==8.2'
          python - <<'PYTHON'
          import os
          import qrcode
          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          version = tag.removeprefix("v")
          url = f"https://github.com/{repo}/releases/download/{tag}/pose-atlas-{version}-debug.apk"
          qrcode.make(url).save("release/beta-download-qr.png")
          PYTHON
      - name: Collect release notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
          else
            printf '# 姿势图鉴 Android %s\n' "$GITHUB_REF_NAME" > release-notes.md
          fi
      - name: Include download QR in release notes
        run: |
          if ! grep -q "releases/download/${GITHUB_REF_NAME}/beta-download-qr.png" release-notes.md; then
            printf '\n\n## 扫码下载\n\n![扫码下载 APK](https://github.com/%s/releases/download/%s/beta-download-qr.png)\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> release-notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: |
            release/pose-atlas-*.apk
            release/SHA256SUMS.txt
            release/beta-download-qr.png
          fail_on_unmatched_files: true
